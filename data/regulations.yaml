items:
  - id: K01
    title: 연구개발비 비목 구성 (2026 개정)
    category: 비목
    source: STD2026
    article: "제5조"
    text: >
      직접비는 인건비, 학생인건비, 연구시설·장비비, 연구재료비, 연구활동비, 연구수당, 보안수당,
      위탁연구개발비, 국제공동연구개발비, 연구개발부담비로 구성되며 2026년 개정으로 연구혁신비가 추가되었다.
      간접비는 인력지원비, 연구지원비, 성과활용지원비로 구성된다.
  - id: K02
    title: 연구혁신비 계상 한도와 증빙
    category: 비목
    source: STD2026
    article: "제10조의2, 제25조의2 (2026.6.11. 시행)"
    text: >
      연구재료비·연구활동비 성격의 비용을 연구혁신비로 사용할 수 있다(외부 전문기술 활용비 제외).
      과제(단계) 시작 시 계상한 연구재료비와 연구활동비 합계의 10% 이내, 연차 평균 5천만원 이내로 계상한다.
      재료 성격 건별 300만원 초과, 활동 성격 건별 50만원 초과, 인건비 성격, 국외 사용 비용은 제외된다.
      RCMS에 사용목적과 거래내역을 입력하면 증명자료를 갖춘 것으로 본다. 총액 증액은 사전승인 대상이다.
  - id: K03
    title: 회의비 중 식비 (2026.5.6. 완화)
    category: 연구활동비
    source: MEET2026
    article: "제25조④"
    text: >
      과제 참여연구자만 참여하는 회의에는 식비를 계상할 수 없다. 과제 미참여자가 참석한 회의는 식비 계상이 가능하며,
      종전의 사전 내부결재 의무는 폐지되었다. 2026.5.6. 이전 집행분은 종전처럼 사전결재 요건을 적용한다.
      농진청·산업부 등 별도 지침 기관은 해당 기관 규정 개정 후 적용될 수 있다.
  - id: K04
    title: 회의비 증빙
    category: 연구활동비
    source: STD2026
    article: "제25조⑤"
    text: >
      회의비는 내부결재문서 또는 회의록과 영수증을 갖춘다. 10만원(부가세 포함) 이하는 목적·일시·장소·내용·참석자 명단이
      포함된 증명자료로 대체할 수 있다.
  - id: K05
    title: 외부 전문기술 활용비 한도
    category: 연구활동비
    source: STD2026
    article: "제25조②"
    text: >
      외부 전문기술 활용비는 직접비(현물 포함)의 40% 범위에서 사용한다. 중앙행정기관의 장이 인정하면 초과할 수 있다.
  - id: K06
    title: 연구수당 계상 한도
    category: 연구수당
    source: STD2026
    article: "제26조"
    text: >
      연구수당은 수정인건비(현물 포함)의 20% 범위에서 계상한다. 참여연구자가 2명 이상이면 1인에게 계상액의 70%를 초과해 지급할 수 없고,
      당초 계상액 대비 증액은 원칙적으로 금지된다. KEITI 정산에서는 연구수당 지급비율이 직접비 사용비율보다 20%p를 초과하면 불인정된다.
  - id: K07
    title: 공통 계상 불가 항목
    category: 공통
    source: STD2026
    article: "제21조④"
    text: >
      환급 가능한 관세·부가가치세, 주류 등 유흥성 비용, 같은 비용의 중복 계상(현금·현물 중복 포함),
      같은 기간 인건비와 학생인건비 동시 계상, 계열사 간 불명확한 비용, 인정되지 않은 임차료 등은 계상할 수 없다.
  - id: K08
    title: 연구인력 지원비 불인정 항목
    category: 연구활동비
    source: STD2026
    article: "제25조⑭"
    text: >
      참여연구자·연구근접지원인력이 아닌 자에 대한 비용, 종신 학회비, 과제와 무관한 학회·세미나 참가비와 교육훈련비,
      학위과정 비용, 환급 가능한 교육비, 평일 점심이나 식비가 포함된 출장일의 식대 등은 인정되지 않는다.
  - id: K09
    title: 현물의 정의와 범위
    category: 현물
    source: ENV_RULE
    article: "제2조제12호"
    text: >
      현물은 기관부담연구개발비 중 연구자 인건비, 연구시설·장비비, 기술도입비·연구재료비를 현금가치로 환산한 금액이다.
      KEITI 사례집은 소프트웨어 활용비도 현물 항목으로 안내한다. 현물 부담액은 간접비 산정 기준인 수정직접비에서 제외된다.
  - id: K10
    title: 타 국가R&D로 구축한 장비의 현물 계상
    category: 현물
    source: KEITI_QA
    article: "사용기준 제66조 관련"
    text: >
      다른 국가연구개발사업 예산으로 구축한 장비는 기관 자체재원이 아니므로 원칙적으로 현물 계상이 불가하다.
      사용기준 제66조 요건을 충족하는 경우에만 예외적으로 가능하다.
  - id: K11
    title: 계획서에 없던 내부 보유 장비 사용
    category: 현물
    source: NRF_QA
    article: "제21조, 제23조④"
    text: >
      당초 계획서에 없던 내부 보유 장비·공간은 사용할 수 없다(비영리기관의 공동활용 장비 예외).
      공동활용 장비는 ZEUS 등록 여부를 확인하고, 기관 자체 사용료 산출 규정과 사용 증명(사용시간, 결과물)을 갖춘다.
  - id: K12
    title: 내부 장비 임차료(사용료) 지급
    category: 현물
    source: KETEP
    article: "산업기술혁신사업 정산 기준"
    text: >
      연구개발기관 내부 보유 장비·시설·공간의 임차료(사용료)를 지급한 경우 불인정한다(전문기관장 인정 시 예외).
      내부 기관 또는 동일 과제 수행기관으로부터 구입·임차한 장비비도 불인정 대상이다. 전문기관별 기준이 다를 수 있다.
  - id: K13
    title: 기관부담 연구개발비 비율 (공기업)
    category: 제안
    source: KEITI_QA
    article: "혁신법 시행령 별표 관련"
    text: >
      공기업·대기업은 정부지원 50% 이하, 기관부담 50% 이상이며 기관부담 중 현금은 15% 이상으로 안내된다(사례집 표 기준, 원문 확인 필요).
      기관부담 현금은 연차별 연구개발기간 종료 3개월 전까지 납부해야 한다.
  - id: K14
    title: 사용실적보고 기한과 제출서류
    category: 정산
    source: KEITI_QA
    article: "ENV 운영규정 제35조"
    text: >
      과제(단계) 종료일부터 3개월 이내에 RCMS로 사용실적보고서를 제출한다. 사용실적보고서, 자체 회계감사 의견서,
      사용 증명자료, 현물부담 확인서(해당 시), 자체규정(해당 시)을 갖춘다. 연차별 사용내역은 연도 종료 후 1개월 이내 보고한다.
  - id: K15
    title: 정산 결과 이의신청과 회수금 반납
    category: 정산
    source: ENV_RULE
    article: "제35조⑦~⑨"
    text: >
      정산 결과 통보일부터 1개월 이내 1회에 한해 이의신청할 수 있고, 행정위원회 심의로 최종정산액을 확정한다.
      회수금은 통보일부터 1개월 이내 반납한다.
  - id: K16
    title: 간접비 회수 기준
    category: 정산
    source: KEITI_QA
    article: "ENV 운영규정 제35조"
    text: >
      직접비 집행률이 50% 이하인 과제에서 간접비 집행률이 직접비 집행률을 초과하면,
      간접비 총액 × (간접비 사용비율 − 직접비 사용비율)을 회수한다.
  - id: K17
    title: 증빙 보관과 현금 지출 제한
    category: 정산
    source: ENV_RULE
    article: "제34조"
    text: >
      지출 근거 증명자료를 갖추지 않은 지출은 인정되지 않으며, 증명자료는 과제(단계) 종료 후 5년간 보관한다.
      현금 지출은 카드·계좌이체가 불가능한 경우에만 허용된다. 협약기간 내 지출원인행위가 없는 잔액은 회수한다.
  - id: K18
    title: 3천만원 이상 연구시설·장비 변경
    category: 연구시설·장비비
    source: ENV_RULE
    article: "제29조②9"
    text: >
      계획서에 3천만원 이상 반영된 연구시설·장비를 새로 구입·임차하거나 변경하려면 사전 승인을 받는다.
      환율·물가 등 불가피한 사유로 당초 금액의 20% 이내에서 증감하는 경우는 예외이다.
  - id: K19
    title: 연구재료 검수 간소화
    category: 연구재료비
    source: STD2026
    article: "제22조③"
    text: >
      구매·검수는 기관 자체규정에 따른다. 일정 기관은 100만원 이하 재료(연차별 1,000만원 이내)에 대해 검수를 간소화할 수 있다.
  - id: K20
    title: 장비 납품·설치 완료 시점
    category: 연구시설·장비비
    source: KETEP
    article: "산업기술혁신사업 정산 기준"
    text: >
      연구개발기간 종료일 2개월 전까지 납품·설치 또는 임차가 완료되지 않은 장비 구입금액은 불인정한다(산업부 사업 기준).
      전문기관별로 기준이 다를 수 있으므로 KEITI 등 해당 기관 지침을 확인한다.
  - id: K21
    title: 위탁연구개발비 한도
    category: 위탁
    source: KEITI_QA
    article: "사례집"
    text: >
      위탁연구개발비는 직접비의 40% 이내로 계상한다.
  - id: K22
    title: 연구개발계획서 표준 구성
    category: 제안
    source: STD2026
    article: "연구개발계획서 서식"
    text: >
      필요성, 목표 및 내용(최종·단계 목표, 연구 내용, 일정·결과물), 추진전략·방법 및 추진체계, 성과 활용방안 및 기대효과,
      사업화 전략(해당 시), 연구개발비 사용계획(현금·현물 구분 총괄표, 참여연구자 인건비 현황, 연구시설·장비 구축계획 등)으로 구성된다.
      서식은 전문기관 공고별로 다르므로 공고문 첨부 서식을 우선한다.
