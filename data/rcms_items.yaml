# RCMS(통합 연구비관리시스템) 비목·세목 체계 — 샘플
# 근거: 과기정통부 고시「국가연구개발사업 연구개발비 사용 기준」(2026.5.6. 개정, 연구혁신비는 2026.6.11. 시행)
# ※ 세목 명칭은 실제 RCMS 입력 화면 기준으로 최종 교체·검증 필요 (verified: false 표시 항목)

basis: "국가연구개발사업 연구개발비 사용 기준 (과기정통부 고시, 2026.5.6. 개정)"
items:
  - bimok: 인건비
    group: 직접비
    semok:
      - name: 내부인건비
        evidence: [참여연구자현황표(현금/현물 구분), 급여대장, 원천징수 내역]
      - name: 외부인건비
        evidence: [참여연구자현황표, 지급 근거, 계좌이체 내역]
  - bimok: 학생인건비
    group: 직접비
    semok:
      - name: 학생인건비
        evidence: [학생연구자 참여 확약, 지급 내역]
  - bimok: 연구시설·장비비
    group: 직접비
    semok:
      - name: 연구시설·장비 구축(구입·설치·임차)
        evidence: [견적서(비교견적), 계약서, 검수조서, 자산등록(ZEUS 등록), 전자세금계산서]
        verified: false
      - name: 연구시설·장비 사용·운영
        evidence: [기관 사용료 규정, 사용일지(사용시간·결과물), 청구 내역]
        verified: false
  - bimok: 연구재료비
    group: 직접비
    semok:
      - name: 연구재료 구입비
        evidence: [전자세금계산서 또는 카드전표, 검수조서(100만원 이하 간소화 가능), 재료 사용 대장]
      - name: 연구재료 제작비
        evidence: [제작 계약서/발주서, 검수조서, 결과물 사진·도면]
      - name: 연구개발과제 관리비
        evidence: [관리시스템 운영 내역]
  - bimok: 연구활동비
    group: 직접비
    semok:
      - name: 지식재산 창출 활동비
        evidence: [출원·등록 서류, 대리인 청구서, 전자세금계산서]
      - name: 외부 전문기술 활용비
        evidence: [용역·의뢰 계약서, 결과물(성적서·보고서), 전자세금계산서]
        limit: "직접비(현물 포함)의 40% 이내 (제25조②)"
      - name: 회의비
        evidence: [회의록(목적·일시·장소·내용·참석자), 영수증]
        limit: "참여연구자만 참석한 회의의 식비 계상 불가 (제25조④, 2026.5.6.~)"
      - name: 출장비
        evidence: [출장명령서, 출장복명서, 교통·숙박 영수증]
      - name: 소프트웨어 활용비
        evidence: [구매·구독 계약서, 라이선스 증서, 전자세금계산서]
      - name: 클라우드컴퓨팅서비스 활용비
        evidence: [이용 계약/청구서, 사용 내역]
      - name: 연구실운영비
        evidence: [구매 증빙, 사용 내역]
      - name: 연구인력 지원비
        evidence: [교육·학회 참가 증빙, 과제 관련성 소명]
      - name: 해외 연구자 유치 지원비
        evidence: [초청 근거, 지급 내역]
      - name: 종합사업관리비
        evidence: [집행 근거]
      - name: 그 밖의 비용
        evidence: [집행 목적 소명, 증빙]
        verified: false
  - bimok: 연구혁신비
    group: 직접비
    semok:
      - name: 연구혁신비
        evidence: [RCMS 사용목적·거래내역 입력으로 증빙 갈음 (제25조의2⑤)]
        limit: "과제 시작 시 연구재료비+연구활동비 합계의 10% 이내, 연차 평균 5천만원 이내. 재료 건별 300만원·활동 건별 50만원 초과, 인건비성, 국외 사용 제외 (제25조의2)"
  - bimok: 연구수당
    group: 직접비
    semok:
      - name: 연구수당
        evidence: [기관 지급기준, 기여도 평가, 지급 내역]
        limit: "수정인건비의 20% 이내, 1인 70% 초과 불가, 증액 불가 (제26조)"
  - bimok: 위탁연구개발비
    group: 직접비
    semok:
      - name: 위탁연구개발비
        evidence: [위탁협약서, 위탁기관 사용실적]
        limit: "직접비의 40% 이내 (KEITI 사례집)"
  - bimok: 국제공동연구개발비
    group: 직접비
    semok:
      - name: 국제공동연구개발비
        evidence: [국제공동연구 협약, 송금 내역]
  - bimok: 연구개발부담비
    group: 직접비
    semok:
      - name: 연구개발부담비
        evidence: [부담 근거]
  - bimok: 간접비
    group: 간접비
    semok:
      - name: 인력지원비
        evidence: [기관 간접비 집행 규정]
      - name: 연구지원비
        evidence: [기관 간접비 집행 규정]
      - name: 성과활용지원비
        evidence: [기관 간접비 집행 규정]
