# 전문기관별 제안서(연구개발계획서) 작성 체크 — 샘플
# 공고문·첨부 서식이 항상 우선. 아래는 연구원 내부 경험을 쌓아가기 위한 초기값.
agencies:
  KEITI:
    name: 한국환경산업기술원 (환경부 환경기술개발사업·물관리연구개발)
    rule_basis: "환경기술개발사업 운영규정, 연구개발비 사용 기준"
    gov_ratio_max_public: 0.50   # 공기업 정부지원 상한 (사례집 표 기준, 원문 확인)
    cash_ratio_min_public: 0.15  # 기관부담 중 현금 최소 (사례집 표 기준, 원문 확인)
    checklist:
      - "공고문 첨부 연구개발계획서 서식 사용 (혁신법 표준서식 기반)"
      - "참여연구자 인건비 현황표에 현금/현물 구분, 참여율·기간 기재"
      - "기관부담 현물 장비는 '연구시설·장비 보유현황' 표에 사전 반영 (계획서 미반영 장비는 정산 시 불인정 위험)"
      - "현물 장비의 취득재원(자체/타 국가R&D) 확인 — 타 국가R&D 구축 장비는 원칙적 현물 불가"
      - "현물 산정 근거(감가상각 또는 기관 사용료 규정) 첨부 가능하게 준비"
      - "위탁연구개발비 직접비 40% 이내"
      - "외부 전문기술 활용비 직접비 40% 이내"
      - "연구수당 수정인건비 20% 이내"
      - "연구혁신비 계상 시 재료비+활동비 10% 이내, 연 평균 5천만원 이내"
      - "3천만원 이상 장비는 구축계획에 명시 (이후 변경 시 사전승인)"
      - "보안등급·안전조치 항목 공고 요구사항 확인"
    pitfalls:
      - "현물 장비를 계획서 총괄표 금액만 적고 보유현황 표에 장비 단위로 쓰지 않음"
      - "공동활용(ZEUS) 등록 대상 장비를 미등록 상태로 현물 계상"
      - "같은 장비를 현물로 잡고 수리·유지비를 현금으로 또 잡아 중복 계상 지적"
  KAIA:
    name: 국토교통과학기술진흥원 (국토교통 R&D)
    rule_basis: "국토교통 연구개발사업 운영규정, 연구개발비 사용 기준"
    gov_ratio_max_public: 0.50
    cash_ratio_min_public: 0.15
    checklist:
      - "공고문 첨부 서식 사용"
      - "기관부담 비율·현금 비율은 공고문 기준 확인"
      - "현물 장비 보유현황 사전 반영"
      - "위탁·외부 전문기술 활용비 한도 확인"
    pitfalls:
      - "샘플 — 연구소 인터뷰 결과로 보완"
  NRF:
    name: 한국연구재단 (과기정통부 사업)
    rule_basis: "연구개발비 사용 기준, NRF 연구비 관리 지침"
    gov_ratio_max_public: 0.50
    cash_ratio_min_public: 0.15
    checklist:
      - "공고문 첨부 서식 사용"
      - "공동활용 장비 ZEUS 등록 확인 후 계상"
      - "연구수당 1인 70% 초과 지급 불가"
    pitfalls:
      - "샘플 — 연구소 인터뷰 결과로 보완"

# 표준 연구개발계획서 목차 (공고별 서식 우선)
plan_outline:
  - key: need
    title: "1. 연구개발과제의 필요성"
    guide: "국내외 현황·문제점·전망, 정부 정책(물관리기본계획 등)과의 연관성"
  - key: goal
    title: "2. 연구개발과제의 목표 및 내용"
    guide: "최종 목표(정성·정량), 단계별 목표, 연구 내용, 수행일정 및 결과물"
  - key: strategy
    title: "3. 추진전략·방법 및 추진체계"
    guide: "목표 달성 방법, 기관 간 역할분담, 추진체계 도식"
  - key: impact
    title: "4. 연구개발성과의 활용방안 및 기대효과"
    guide: "현장 적용처(정수장·댐·광역상수도 등), 과학기술·경제·사회적 효과"
  - key: biz
    title: "5. 사업화 전략 및 계획 (해당 시)"
    guide: "시장동향, 지식재산권·표준화, 기술이전 계획"
  - key: budget
    title: "6. 연구개발비 사용계획"
    guide: "현금·현물 구분 총괄표, 참여연구자 인건비 현황, 연구시설·장비 보유현황 및 구축계획"
